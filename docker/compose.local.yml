services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-craftdock}
      POSTGRES_USER: ${POSTGRES_USER:-craftdock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}
    volumes:
      - craftdock-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  manager:
    build:
      context: ..
      dockerfile: apps/manager/Dockerfile
    environment:
      NODE_ENV: development
      MANAGER_HOST: 0.0.0.0
      MANAGER_PORT: 4000
      WORKER_ID: ${WORKER_ID:?Set WORKER_ID in the project .env file}
      WORKER_TOKEN: ${WORKER_TOKEN:?Set WORKER_TOKEN in the project .env file}
      DATABASE_URL: postgresql://${POSTGRES_USER:-craftdock}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}@postgres:5432/${POSTGRES_DB:-craftdock}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@craftdock.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the project .env file}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:4000}
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-10000}
      WORKER_TIMEOUT_MS: ${WORKER_TIMEOUT_MS:-45000}
      HEARTBEAT_SWEEP_INTERVAL_MS: 5000
      LOG_LEVEL: info
    ports:
      - '127.0.0.1:${MANAGER_PORT:-4000}:4000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    build:
      context: ..
      dockerfile: apps/agent/Dockerfile
    environment:
      NODE_ENV: development
      MANAGER_WS_URL: ws://manager:4000/api/v1/agent
      WORKER_ID: ${WORKER_ID:?Set WORKER_ID in the project .env file}
      WORKER_TOKEN: ${WORKER_TOKEN:?Set WORKER_TOKEN in the project .env file}
      RECONNECT_BASE_DELAY_MS: 1000
      RECONNECT_MAX_DELAY_MS: 30000
      LOG_LEVEL: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - '0'
    depends_on:
      manager:
        condition: service_healthy
    restart: unless-stopped

volumes:
  craftdock-pgdata:
