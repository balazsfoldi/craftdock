<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CraftDock</title>
  <style>
    :root{color-scheme:dark;font:16px system-ui,sans-serif;background:#101720;color:#e8f2ff}body{max-width:1100px;margin:32px auto;padding:0 20px}h1,h2{margin:0 0 14px}p{color:#a9c6e7}.card{background:#151f2b;border:1px solid #2a3d50;border-radius:16px;padding:22px;margin:18px 0}form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:grid;gap:6px}input{background:#101820;color:#fff;border:1px solid #3a536a;border-radius:9px;padding:12px}button{border:0;border-radius:10px;background:#68d9b8;color:#04140f;font-weight:700;padding:12px 18px;cursor:pointer}button.secondary{background:#34475b;color:#fff}button.danger{background:#a84949;color:white}.actions{display:flex;gap:10px;flex-wrap:wrap}.server{border-top:1px solid #2a3d50;padding:18px 0}.logs{background:#080d12;color:#bde4ff;height:190px;overflow:auto;white-space:pre-wrap;padding:12px;border-radius:9px;font:13px ui-monospace,monospace}#error{color:#ff7f79;min-height:1.5em}.wide{grid-column:1/-1}.hidden{display:none}@media(max-width:650px){form{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><h1>CraftDock</h1><p>Minecraft server control</p></header>
  <p id="error" role="status"></p>
  <section id="login" class="card hidden"><h2>Administrator sign in</h2><p>Use the account configured for this CraftDock Manager.</p><form id="loginForm"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="wide">Sign in</button></form></section>
  <main id="dashboard" class="hidden">
    <section class="card"><div class="actions" style="justify-content:space-between"><h2>Servers</h2><button id="logout" class="secondary">Sign out</button></div></section>
    <section class="card"><h2>Create a Vanilla server</h2><p>World data stays in a named volume. Ports are assigned automatically.</p><form id="createForm"><label>Server name<input name="name" required maxlength="64"></label><label>Minecraft version<input name="minecraftVersion" value="1.21.4" required pattern="[0-9]+\.[0-9]+(\.[0-9]+)?"></label><label>Memory (MB)<input name="memoryMb" type="number" min="1024" max="8192" value="2048" required></label><label>CPU limit<input name="cpuLimit" type="number" min="1" max="8" step="0.1" value="2" required></label><label class="wide"><span><input name="acceptMinecraftEula" type="checkbox" required> I have read and agree to the <a href="https://www.minecraft.net/eula" target="_blank" rel="noreferrer">Minecraft EULA</a>.</span></label><button class="wide">Create server</button></form></section>
    <section class="card"><div class="actions" style="justify-content:space-between"><div><h2>Servers</h2><p>Desired and observed states are shown separately.</p></div><button id="refresh" class="secondary">Refresh</button></div><div id="servers"></div></section>
  </main>
<script>
const $=s=>document.querySelector(s), errorBox=$('#error');let servers=[];
async function api(path,options={}){const response=await fetch(path,{credentials:'same-origin',...options,headers:{...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error?.code||`HTTP_${response.status}`);return data}
async function mutate(path,method,body){const {csrfToken}=await api('/api/v1/auth/csrf');return api(path,{method,headers:{'content-type':'application/json','x-craftdock-csrf':csrfToken,'idempotency-key':crypto.randomUUID()},body:JSON.stringify(body??{})})}
function showError(e){errorBox.textContent=`Operation failed: ${e.message}`}
async function refresh(){const result=await api('/api/v1/servers');servers=result.servers;const root=$('#servers');root.replaceChildren();if(!servers.length){root.textContent='No servers yet. Create one to get started.';return}for(const server of servers){const card=document.createElement('article');card.className='server';const title=document.createElement('h3');title.textContent=server.name;const details=document.createElement('p');details.textContent=`Vanilla ${server.minecraftVersion} · ${server.memoryMb} MB · ${server.cpuLimit} CPU · port ${server.hostPort} · desired ${server.desiredState} · observed ${server.observedState}`;const actions=document.createElement('div');actions.className='actions';const addButton=(label,cls,fn)=>{const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;actions.append(b)};addButton('Start','',()=>operate(server,'start'));addButton('Stop','secondary',()=>operate(server,'stop'));addButton('Show logs','secondary',()=>showLogs(server,card));addButton('Delete server','danger',()=>removeServer(server));const logs=document.createElement('pre');logs.className='logs hidden';card.append(title,details,actions,logs);root.append(card)}}
async function operate(server,action){try{const {operation}=await mutate(`/api/v1/servers/${server.id}/${action}`,'POST');await waitOperation(operation.id);await refresh()}catch(e){showError(e)}}
async function waitOperation(id){for(let i=0;i<120;i++){const {operation}=await api(`/api/v1/operations/${id}`);if(['SUCCEEDED','FAILED'].includes(operation.status)){if(operation.status==='FAILED')throw new Error(operation.errorCode||'OPERATION_FAILED');return}await new Promise(r=>setTimeout(r,1000))}throw new Error('OPERATION_TIMEOUT')}
async function removeServer(server){if(prompt(`Type the server name to delete: ${server.name}`)!==server.name)return;const deleteWorld=confirm('Permanently delete this server world volume too? Choose Cancel to keep the world data.');try{const {operation}=await mutate(`/api/v1/servers/${server.id}`,'DELETE',{deleteWorld});await waitOperation(operation.id);await refresh();alert(deleteWorld?'Server and world volume deleted.':'Server deleted. World volume retained for recovery.')}catch(e){showError(e)}}
function showLogs(server,card){const box=card.querySelector('.logs');box.classList.remove('hidden');box.textContent='Connecting to live logs…\n';const stream=new EventSource(`/api/v1/servers/${server.id}/logs`);stream.addEventListener('log',event=>{const line=JSON.parse(event.data);box.textContent+=`[${new Date(line.timestamp).toLocaleTimeString()}] ${line.line}\n`;box.scrollTop=box.scrollHeight});stream.onerror=()=>{box.textContent+='Log connection interrupted.\n';stream.close()}}
$('#loginForm').onsubmit=async event=>{event.preventDefault();try{const form=new FormData(event.currentTarget);await api('/api/v1/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:form.get('email'),password:form.get('password')})});await boot()}catch(e){showError(e)}};
$('#createForm').onsubmit=async event=>{event.preventDefault();try{const form=new FormData(event.currentTarget);await mutate('/api/v1/servers','POST',{name:form.get('name'),minecraftVersion:form.get('minecraftVersion'),memoryMb:Number(form.get('memoryMb')),cpuLimit:Number(form.get('cpuLimit')),acceptMinecraftEula:form.get('acceptMinecraftEula')==='on'});event.currentTarget.reset();event.currentTarget.elements.minecraftVersion.value='1.21.4';event.currentTarget.elements.memoryMb.value='2048';event.currentTarget.elements.cpuLimit.value='2';await refresh()}catch(e){showError(e)}};
$('#refresh').onclick=()=>refresh().catch(showError);$('#logout').onclick=async()=>{try{await mutate('/api/v1/auth/logout','POST');await boot()}catch(e){showError(e)}};
async function boot(){errorBox.textContent='';try{const session=await api('/api/v1/auth/session');$('#login').classList.toggle('hidden',session.authenticated);$('#dashboard').classList.toggle('hidden',!session.authenticated);if(session.authenticated)await refresh()}catch(e){showError(e)}}boot();
</script>
</body></html>
